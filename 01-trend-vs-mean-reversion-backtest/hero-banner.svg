<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380" role="img" aria-label="Trend vs Mean Reversion Backtest — SharkDev.ai Strategy Lab">
  <defs>
    <!-- Dark theme background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="50%" stop-color="#0D1426"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </linearGradient>

    <!-- Winner gradient (Teal/Green) -->
    <linearGradient id="winnerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>

    <!-- Loser gradient (Red/Orange) -->
    <linearGradient id="loserGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4757"/>
      <stop offset="50%" stop-color="#FF6B7A"/>
      <stop offset="100%" stop-color="#FF4757"/>
    </linearGradient>

    <!-- Accent gradient (Blue/Teal) -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A1FF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse animation for winner badge -->
    <animate id="pulseWinner" attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>

    <!-- Float animation -->
    <animateTransform id="floatAnim" attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3s" repeatCount="indefinite"/>
  </defs>

  <!-- Background -->
  <rect width="1400" height="380" fill="url(#bgGradient)"/>

  <!-- Subtle diagonal accent lines -->
  <g stroke="url(#accentGradient)" stroke-width="1" opacity="0.08">
    <line x1="0" y1="380" x2="1400" y2="0"/>
    <line x1="200" y1="380" x2="1600" y2="0"/>
    <line x1="-200" y1="380" x2="1200" y2="0"/>
    <line x1="400" y1="380" x2="1800" y2="0"/>
    <line x1="-400" y1="380" x2="1000" y2="0"/>
  </g>

  <!-- Floating particles -->
  <g fill="#00D4AA" opacity="0.5">
    <circle cx="150" cy="80" r="2">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1250" cy="300" r="2">
      <animate attributeName="cy" values="300;280;300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="50" r="3">
      <animate attributeName="cy" values="50;20;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Content -->
  <g transform="translate(700, 160)">
    <!-- Project Title -->
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="42" fill="url(#accentGradient)" filter="url(#glow)" letter-spacing="1">
      Trend vs Mean Reversion
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="18" fill="#A0B8D8" letter-spacing="2">
      Strategy Showdown
    </text>

    <!-- Divider -->
    <line x1="-200" y1="52" x2="200" y2="52" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>

    <!-- Winner & Loser Cards -->
    <g transform="translate(-320, 70)">
      <!-- Winner Card -->
      <rect x="-150" y="0" width="300" height="180" rx="12" fill="#111827" stroke="#00D4AA" stroke-width="1.5" filter="url(#softGlow)">
        <animateTransform href="#floatAnim" />
      </rect>

      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#00D4AA" letter-spacing="2">WINNER</text>

      <text x="0" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="40" fill="url(#winnerGradient)" filter="url(#glow)">+42.3%</text>

      <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#E0E8F0">Donchian EMA Trend</text>
      <text x="0" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#70A1FF">4H BTCUSD • 200 EMA Filter</text>

      <g transform="translate(0, 150)">
        <text x="-70" y="0" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Sharpe</text>
        <text x="-70" y="18" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#00D4AA">1.34</text>
        <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Max DD</text>
        <text x="0" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FFA500">-16.2%</text>
        <text x="70" y="0" text-anchor="start" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Win Rate</text>
        <text x="70" y="18" text-anchor="start" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#00D4AA">54.3%</text>
      </g>
    </g>

    <g transform="translate(320, 70)">
      <!-- Loser Card -->
      <rect x="-150" y="0" width="300" height="180" rx="12" fill="#111827" stroke="#FF4757" stroke-width="1.5" filter="url(#softGlow)">
        <animateTransform href="#floatAnim" />
      </rect>

      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FF4757" letter-spacing="2">LOSER</text>

      <text x="0" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="40" fill="url(#loserGradient)" filter="url(#glow)">-12.1%</text>

      <text x="0" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#E0E8F0">BB RSI Mean Reversion</text>
      <text x="0" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#FF6B7A">1H ETHUSD • No Trend Filter</text>

      <g transform="translate(0, 150)">
        <text x="-70" y="0" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Sharpe</text>
        <text x="-70" y="18" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FF4757">-0.89</text>
        <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Max DD</text>
        <text x="0" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FF4757">-21.4%</text>
        <text x="70" y="0" text-anchor="start" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#A0B8D8">Win Rate</text>
        <text x="70" y="18" text-anchor="start" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FF4757">41.7%</text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(700, 330)">
    <a href="https://sharkdev.ai" target="_blank" rel="noopener noreferrer">
      <rect x="-180" y="-20" width="360" height="40" rx="20" fill="url(#winnerGradient)" filter="url(#softGlow)">
        <animate attributeName="filter" values="url(#softGlow); url(#glow); url(#softGlow)" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="9" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#0A0F1C">Backtest on SharkDev.ai →</text>
    </a>
  </g>

  <!-- Footer attribution -->
  <text x="700" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="11" fill="#4A5A7A">
    4H BTCUSD vs 1H ETHUSD • Follow @sharkdev_ai on X
  </text>
</svg>